[project]
name = "machine-learning-from-scratch"
version = "0.1.0"
description = "Study machine learning mathematics and algorithms from first principles."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
ml_from_scratch = ["data/iris.data", "data/iris-provenance.json", "data/NOTICE.md"]
